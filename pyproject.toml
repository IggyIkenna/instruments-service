[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "instruments-service"
version = "0.1.22"
description = "Service for generating canonical instrument definitions from exchange APIs"
readme = "README.md"
authors = [
    { name = "Unified Trading System", email = "ikenna@odum-research.com" },
]
keywords = [
    "trading",
    "instruments",
    "exchange",
    "market-data",
    "cryptocurrency",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.3.0,<2.4.0",
    "pandas>=2.3.0,<3.0.0",
    "polars<2.0.0,>=1.37.0",
    "pydantic>=2.12.5,<3.0.0",
    "pydantic-settings>=2.12.0,<3.0.0",
    "pyjwt>=2.12.0,<3.0.0",
    "python-dateutil>=2.8.2,<3.0.0",
    "python-dotenv<2.0.0,>=1.2.2",
    "web3>=6.20.0,<7.0.0",
    "eth-abi<6.0.0,>=5.0.1",
    "databento>=0.32.0,<1.0.0",
    "exchange-calendars>=4.5.0,<5.0.0",
    "yfinance>=0.2.66,<1.0.0",
    "ccxt<5.0.0,>=4.5.24",
    "plotly>=6.4.0,<7.0.0",
    "unified-trading-library>=0.1.0,<1.0.0",
    "unified-api-contracts>=0.1.0,<1.0.0",
    "ib_insync>=0.9.86,<1.0.0",
    "prometheus-client<1.0.0,>=0.20.0",
    "pytest>=9.0.3,<10.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "pytest-socket>=0.7.0,<1.0.0",
    "pytest-asyncio>=0.25.0,<2.0.0",
    "pytest-mock>=3.15.0,<4.0.0",
    "pytest-timeout>=2.4.0,<3.0.0",
    "pytest-xdist>=3.6.0,<4.0.0",
    "ruff==0.15.0",
    "basedpyright==1.38.2",
    "pip-audit>=2.7.0,<3.0.0",
    "bandit>=1.7.0,<2.0.0",
    "prek>=0.3.0,<1.0.0",
    "pandas-stubs>=2.2.0,<3.0.0",
    "pygments>=2.20.0,<3.0.0",
    "requests>=2.33.0,<3.0.0",
    "curl-cffi>=0.15.0,<1.0.0",
    "aiohttp>=3.13.4,<4.0.0",

]

[project.license]
text = "MIT"
[project.scripts]
instruments-service = "instruments_service.cli.main:main_service_cli"

[project.urls]
Homepage = "https://github.com/iggyikenna/instruments-service"
Documentation = "https://github.com/iggyikenna/instruments-service"
Repository = "https://github.com/iggyikenna/instruments-service"

[tool.uv.sources.unified-trading-library]
path = "../unified-trading-library"
editable = true

[tool.uv.sources.unified-api-contracts]
path = "../unified-api-contracts"
editable = true



[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [".cursor", ".venv", ".venv-workspace", "build", "dist", "node_modules"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "G", "C90"]
extend-ignore = ["G003", "G004"]
ignore = ["E402", "E501", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 26

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F401", "E402"]
"tests/*" = ["F401", "F841", "F811"]
"tests/conftest.py" = ["E402"]
"instruments_service/cli/main.py" = ["E402"]
"scripts/*" = ["E722"]
"instruments_service/config/service_config.py" = ["N802"]
"instruments_service/config.py" = ["RUF012"]
"instruments_service/config/venue_config.py" = ["RUF012"]
"instruments_service/app/core/processors/ccxt_manual_fallback.py" = ["N806"]
"instruments_service/engine/processors/ccxt_manual_fallback.py" = ["N806"]
"tests/unit/test_cloud_agnostic_paths.py" = ["N806"]
"tests/smoke/test_shard_combinatorics.py" = ["E402", "F821"]
"tests/**/*.py" = ["N817", "F841"]

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["instruments_service"]
exclude = ["tests", "**/__pycache__", ".venv*", ".venv-workspace", "build", "dist", "node_modules"]
reportAny = "error"
reportMissingTypeStubs = false
reportUnusedImport = "none"
reportUnnecessaryIsInstance = "none"
reportUnnecessaryCast = "none"
reportIncompatibleMethodOverride = "none"

[[tool.basedpyright.executionEnvironments]]
root = "."
pythonVersion = "3.13"
pythonPlatform = "All"
extraPaths = [
    "../unified-market-interface",
    "../unified-api-contracts",
    "../unified-config-interface",
    "../unified-internal-contracts",
    "../unified-trading-library",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "unit: mark test as unit test",
    "integration: library contract test — verifies imported symbols exist and have expected API (runs in CI, no credentials needed)",
    "e2e: end-to-end test writing real data — requires IS_TEST_RUN=true and real GCP project",
    "live: requires live external API access or real GCP credentials — skipped in CI",
    "smoke: mark test as smoke test",
]

[tool.coverage.run]
source = ["instruments_service"]
branch = true

[tool.coverage.report]
fail_under = 77
show_missing = true
skip_covered = false
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "raise NotImplementedError",
]

[tool.bandit]
skips = []
