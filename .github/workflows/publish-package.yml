name: Publish to GitHub Packages

on:
  release:
    types: [created]
  push:
    tags:
      - 'v*'  # Publish when tags like v0.1.0, v0.2.0, etc. are pushed
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.0)'
        required: true
        default: '0.1.0'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build twine
      
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            # From GitHub Release
            VERSION="${{ github.event.release.tag_name }}"
            # Remove 'v' prefix if present
            VERSION="${VERSION#v}"
          elif [ "${{ github.event_name }}" == "push" ]; then
            # From git tag push (e.g., v0.1.0)
            VERSION="${GITHUB_REF#refs/tags/}"
            # Remove 'v' prefix if present
            VERSION="${VERSION#v}"
          else
            # From workflow_dispatch (manual trigger)
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Publishing version: $VERSION"
      
      - name: Update version in pyproject.toml
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Update version in pyproject.toml using sed
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
          echo "✅ Updated pyproject.toml version to $VERSION"
      
      - name: Build package
        run: |
          python -m build
      
      - name: Publish to GitHub Packages
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m twine upload \
            --repository-url https://upload.pkg.github.com/${{ github.repository_owner }} \
            dist/*
      
      - name: Verify publication
        run: |
          echo "✅ Package published successfully!"
          echo "📦 Version: ${{ steps.version.outputs.version }}"
          echo "🔗 Install with: pip install instruments-service==${{ steps.version.outputs.version }} --extra-index-url https://__token__:\$GITHUB_TOKEN@pypi.pkg.github.com/iggyikenna/simple"

