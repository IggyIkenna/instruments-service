# Pre-commit hooks - auto-format on commit
# Setup: pip install prek && prek install

repos:
  # Library version auto-bump (for packages published to Artifact Registry)
  - repo: local
    hooks:
      - id: bump-library-version
        name: Auto-bump library version
        entry: bash scripts/bump-library-version.sh
        language: system
        stages: [commit]
        pass_filenames: false
        always_run: true

  # Import pattern checker
  - repo: local
    hooks:
      - id: check-import-patterns
        name: Check external import patterns
        entry: python3 .cursor/scripts/check-import-patterns.py
        language: python
        files: \.py$
        pass_filenames: false
        stages: [commit]

  # Ruff - Fast Python linter AND formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff
        name: Lint with Ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: Format with Ruff

  # Basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1000"]
