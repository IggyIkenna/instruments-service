[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --cov=instruments_service --cov-report=term-missing --cov-fail-under=30
# Note: pytest_plugins is declared in conftest.py (not valid in pytest.ini)
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    asyncio: Async tests (pytest-asyncio)
asyncio_mode = auto
