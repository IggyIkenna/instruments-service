# Quality Gates for instruments-service
#
# This workflow runs the EXACT same checks as:
#   - Local: ./scripts/quality-gates.sh
#   - Cloud Build: cloudbuild.yaml
#
# All three MUST be kept in sync. If you change one, change all three.
#
name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Checkout dependencies
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_PAT" ]; then
            # Branch-fallback pattern: try dep-branch first, fallback to main
            DEP_BRANCH="${{ github.head_ref }}"

            clone_dep() {
              local repo=$1
              git clone -b "$DEP_BRANCH" https://x-access-token:${GH_PAT}@github.com/IggyIkenna/${repo}.git ../${repo} 2>/dev/null \
                || git clone https://x-access-token:${GH_PAT}@github.com/IggyIkenna/${repo}.git ../${repo}
              echo "✅ Cloned ${repo} (branch: ${DEP_BRANCH} or main fallback)"
            }

            clone_dep api-contracts
            clone_dep unified-trading-library
            clone_dep unified-events-interface
            clone_dep unified-domain-client
            clone_dep unified-config-interface
            clone_dep unified-market-interface

            # Clone deployment-service (for smoke tests config)
            git clone -b "$DEP_BRANCH" https://x-access-token:${GH_PAT}@github.com/IggyIkenna/deployment-service.git ../deployment-service 2>/dev/null \
              || git clone https://x-access-token:${GH_PAT}@github.com/IggyIkenna/deployment-service.git ../deployment-service \
              || echo "⚠️ Could not clone deployment-service (optional)"
          else
            echo "❌ GH_PAT not set" && exit 1
          fi

      - name: Install ripgrep (required for codex checks)
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install dependencies
        run: |
          pip install uv
          uv venv .venv
          uv pip install --python .venv/bin/python -e ../api-contracts 2>/dev/null || true
          uv pip install --python .venv/bin/python -e ../unified-trading-library
          uv pip install --python .venv/bin/python -e ../unified-events-interface
          uv pip install --python .venv/bin/python -e ../unified-domain-client
          uv pip install --python .venv/bin/python -e ../unified-config-interface
          uv pip install --python .venv/bin/python -e ../unified-market-interface
          uv pip install --python .venv/bin/python -e . --no-deps
          uv pip install --python .venv/bin/python pydantic pydantic-settings pandas numpy python-dateutil \
            python-dotenv requests ccxt plotly web3 eth-abi databento boto3 \
            exchange-calendars yfinance polars
          uv pip install --python .venv/bin/python pytest pytest-cov pytest-asyncio pytest-mock pytest-timeout pytest-xdist ruff==0.15.0 basedpyright pip-audit>=2.7.0

      - name: Add venv to PATH
        run: echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH
      - name: Clone build scripts
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          DEP_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          BRANCH="${DEP_BRANCH:-main}"
          (git clone -b "$BRANCH" "https://x-access-token:${GH_PAT}@github.com/IggyIkenna/unified-trading-pm.git" ../unified-trading-pm 2>/dev/null \
            || git clone -b main "https://x-access-token:${GH_PAT}@github.com/IggyIkenna/unified-trading-pm.git" ../unified-trading-pm 2>/dev/null) || true
          echo "✅ unified-trading-pm cloned for quality-gates base scripts"

      - name: Run quality gates
        env:
          CLOUD_MOCK_MODE: "true"
          GCP_PROJECT_ID: "test-project"
          DEPLOYMENT_CONFIG_DIR: "../deployment-service/configs"
        run: bash scripts/quality-gates.sh

      - name: Quality gates passed
        run: |
          echo ""
          echo "======================================================================"
          echo "✅ ALL QUALITY GATES PASSED"
          echo "======================================================================"
