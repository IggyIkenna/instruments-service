# Quality Gates for instruments-service
#
# This workflow runs the EXACT same checks as:
#   - Local: ./scripts/quality-gates.sh
#   - Cloud Build: cloudbuild.yaml
#
# All three MUST be kept in sync. If you change one, change all three.
#
name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Checkout unified-cloud-services
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_PAT" ]; then
            git clone https://x-access-token:${GH_PAT}@github.com/IggyIkenna/unified-cloud-services.git ../unified-cloud-services
            echo "✅ Cloned unified-cloud-services"
          else
            echo "⚠️ GH_PAT not set, skipping unified-cloud-services clone"
            exit 1
          fi

      - name: Checkout unified-trading-deployment-v2 (for smoke tests)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_PAT" ]; then
            git clone https://x-access-token:${GH_PAT}@github.com/IggyIkenna/unified-trading-deployment-v2.git ../unified-trading-deployment-v2
            echo "✅ Cloned unified-trading-deployment-v2"
          else
            echo "⚠️ GH_PAT not set, skipping unified-trading-deployment-v2 clone"
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel

          # Install unified-cloud-services first
          pip install -e ../unified-cloud-services

          # Install unified-trading-deployment-v2 (for smoke tests)
          pip install -e ../unified-trading-deployment-v2 || true

          # Install instruments-service without deps first
          pip install -e . --no-deps

          # Install core dependencies
          pip install pydantic pydantic-settings pandas numpy python-dateutil \
            python-dotenv requests ccxt plotly web3 eth-abi databento boto3 \
            exchange-calendars yfinance polars

          # Install test dependencies
          pip install pytest pytest-asyncio pytest-mock pytest-timeout ruff

      # ========================================================================
      # LINTING (ruff) - MUST PASS
      # ========================================================================
      - name: Lint with ruff
        run: |
          echo "=== Running linting (ruff) ==="
          ruff check instruments_service/ tests/
          echo "✅ Linting passed"

      # ========================================================================
      # UNIT TESTS - MUST PASS
      # ========================================================================
      - name: Run unit tests
        run: |
          echo "=== Running unit tests ==="
          python -m pytest tests/unit/ -v --tb=short --timeout=60
          echo "✅ Unit tests passed"

      # ========================================================================
      # INTEGRATION TESTS - MUST PASS
      # ========================================================================
      - name: Run integration tests
        run: |
          echo "=== Running integration tests ==="
          if [ -d "tests/integration" ]; then
            python -m pytest tests/integration/ -v --tb=short --timeout=120 \
              --ignore=tests/integration/test_performance.py \
              -k "not api and not live and not download"
            echo "✅ Integration tests passed"
          else
            echo "No integration tests directory found"
          fi

      # ========================================================================
      # E2E TESTS - MUST PASS
      # ========================================================================
      - name: Run e2e tests
        env:
          CLOUD_MOCK_MODE: "true"
          GOOGLE_CLOUD_PROJECT: "test-project"
        run: |
          echo "=== Running e2e tests ==="
          if [ -d "tests/e2e" ]; then
            python -m pytest tests/e2e/ -v --tb=short --timeout=180
            echo "✅ E2E tests passed"
          else
            echo "No e2e tests directory found"
          fi

      # ========================================================================
      # SMOKE TESTS (shard combinatorics) - MUST PASS
      # ========================================================================
      - name: Run smoke tests
        env:
          CLOUD_MOCK_MODE: "true"
          GOOGLE_CLOUD_PROJECT: "test-project"
          DEPLOYMENT_CONFIG_DIR: "../unified-trading-deployment-v2/configs"
        run: |
          echo "=== Running smoke tests ==="
          if [ -d "tests/smoke" ]; then
            python -m pytest tests/smoke/ -v --tb=short --timeout=180
            echo "✅ Smoke tests passed"
          else
            echo "No smoke tests directory found"
          fi

      - name: Quality gates passed
        run: |
          echo ""
          echo "======================================================================"
          echo "✅ ALL QUALITY GATES PASSED"
          echo "======================================================================"
