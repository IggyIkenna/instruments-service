[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Note: pytest_plugins is declared in conftest.py (not valid in pytest.ini)
# -p no:network-block: disable UAC entry-point auto-registration; conftest.py
# loads the plugin explicitly via pytest_plugins so there's no double-registration.
addopts = -p no:network-block
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    asyncio: Async tests (pytest-asyncio)
asyncio_mode = auto
