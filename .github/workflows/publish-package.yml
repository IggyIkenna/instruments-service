name: publish-package

# Per-repo workflow: triggers PM's publish-package reusable workflow on push to main.
# Dispatches to unified-trading-pm with repo name, version, and commit SHA.
#
# To install in a library repo:
#   cp this file to .github/workflows/publish-package.yml
#
# Prerequisites:
#   - GH_PAT secret with repo dispatch permissions
#   - pyproject.toml with version field

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dispatch-publish:
    runs-on: [self-hosted, glue]
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Every repo is now `dynamic = ["version"]` + hatch-vcs (source = "vcs") — a shallow
          # checkout carries no tags, so `git describe` below would silently resolve to nothing.
          fetch-depth: 0

      - name: Extract version and dispatch
        run: |
          set -euo pipefail

          REPO="${{ github.event.repository.name }}"
          COMMIT_SHA="${{ github.sha }}"

          # VERSION here is a best-effort HINT only — the receiver (PM's publish-package.yml)
          # builds the actual wheel and republishes under the BUILT version, which is the one
          # that's authoritative. A static `version = "X.Y.Z"` grep matches nothing under
          # `dynamic = ["version"]` (every repo, since the hatch-vcs migration), so derive it
          # the same way hatch-vcs does: from the nearest reachable tag. An unreachable tag
          # (shallow history, no v* tag yet) must NOT block the dispatch — the receiver's own
          # fetch-depth:0 checkout + fail-closed-on-0.0.0.dev0 guard is the real gate.
          VERSION=$(git describe --tags --always --match 'v*' 2>/dev/null | sed 's/^v//' || echo "unknown")

          echo "Dispatching publish-package: repo=$REPO version=$VERSION sha=$COMMIT_SHA"

          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository_owner }}/unified-trading-pm/dispatches" \
            -d "{\"event_type\": \"publish-package\", \"client_payload\": {\"repo\": \"${REPO}\", \"version\": \"${VERSION}\", \"commit_sha\": \"${COMMIT_SHA}\"}}"

          echo "Dispatch sent successfully"
