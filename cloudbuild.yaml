# Cloud Build for instruments-service
#
# ARCHITECTURE: Test the artifact you deploy
#   1. Build Docker image
#   2. Run quality gates INSIDE the image
#   3. Push ONLY if tests pass
#
steps:
  # Step 1: Configure Docker authentication
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'configure-docker'
    args: ['auth', 'configure-docker', 'asia-northeast1-docker.pkg.dev', '--quiet']
    waitFor: ['-']

  # Step 2: Ensure artifact repository exists
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'ensure-repo'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud artifacts repositories describe instruments \
          --location=asia-northeast1 &>/dev/null || \
        gcloud artifacts repositories create instruments \
          --repository-format=docker \
          --location=asia-northeast1 \
          --description="instruments-service Docker images"
    waitFor: ['-']

  # Step 3: Pull base image (required for authenticated access during build)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'pull-base-image'
    args: ['pull', 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/unified-cloud-services/unified-cloud-services:latest']
    waitFor: ['configure-docker']

  # Step 4: Build the image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile'
      - '--build-arg'
      - 'PROJECT_ID=$PROJECT_ID'
      - '-t'
      - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/instruments/instruments-service:$SHORT_SHA'
      - '-t'
      - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/instruments/instruments-service:latest'
      - '.'
    waitFor: ['pull-base-image', 'ensure-repo']

  # Step 5: Run quality gates INSIDE the image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'quality-gates'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        echo "Running quality gates inside instruments-service image..."
        docker run --rm \
          -e CLOUD_MOCK_MODE=true \
          -e GOOGLE_CLOUD_PROJECT=$PROJECT_ID \
          -e INSTRUMENTS_STORE_GCS_BUCKET=mock-instruments-bucket \
          asia-northeast1-docker.pkg.dev/$PROJECT_ID/instruments/instruments-service:$SHORT_SHA \
          bash scripts/quality-gates.sh --no-fix --quick
    waitFor: ['build']

  # Step 6: Push image ONLY if quality gates passed
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push'
    args: ['push', '--all-tags', 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/instruments/instruments-service']
    waitFor: ['quality-gates']

images:
  - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/instruments/instruments-service:$SHORT_SHA'
  - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/instruments/instruments-service:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1800s'
