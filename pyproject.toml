[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "instruments-service"
version = "0.1.0"
description = "Service for generating canonical instrument definitions from exchange APIs"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Unified Trading System", email = "ikenna@odum-research.com"}
]
keywords = ["trading", "instruments", "exchange", "market-data", "ccxt", "cryptocurrency"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.11"
dependencies = [
    # Core data processing
    "numpy>=2.4.0",
    "pandas>=3.0.0",
    # Validation
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    # Utilities
    "python-dateutil>=2.8.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.5",
    # Exchange integrations
    "ccxt>=4.5.24",
    "web3>=6.0.0",
    "eth-abi>=4.0.0",
    "databento>=0.20.0",
    "exchange-calendars>=4.5.0",
    "yfinance>=0.2.50",
    # Visualization
    "plotly>=6.4.0",
    # AWS
    "boto3>=1.40.70",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-mock>=3.14.0",
    "black>=25.11.0",
    "isort>=7.0.0",
    "mypy>=1.19.0",
    "pre-commit>=4.4.0",
]

[project.scripts]
instruments-service = "instruments_service.cli.main:run_cli"

[project.urls]
Homepage = "https://github.com/iggyikenna/instruments-service"
Documentation = "https://github.com/iggyikenna/instruments-service"
Repository = "https://github.com/iggyikenna/instruments-service"

[tool.setuptools]
packages = ["instruments_service"]
include-package-data = true

[tool.black]
line-length = 100
target-version = ['py311', 'py312', 'py313']

[tool.mypy]
python_version = "3.11"
warn_return_any = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # Line too long - handled by black
    "E722",  # Do not use bare `except` - allowed in scripts for simplicity
]

[tool.ruff.lint.per-file-ignores]
# Allow imports not at top of file where intentional (setup before imports)
"instruments_service/cli/main.py" = ["E402"]
"tests/conftest.py" = ["E402"]
"scripts/*" = ["E722"]  # Allow bare except in scripts
