# Quality Gates for instruments-service
#
# This workflow runs the EXACT same checks as:
#   - Local: ./scripts/quality-gates.sh
#   - Cloud Build: cloudbuild.yaml
#
# All three MUST be kept in sync. If you change one, change all three.
#
name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Checkout dependencies
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_PAT" ]; then
            # Clone unified-cloud-services (required)
            git clone https://x-access-token:${GH_PAT}@github.com/IggyIkenna/unified-cloud-services.git deps/unified-cloud-services
            echo "✅ Cloned unified-cloud-services"

            # Clone unified-events-interface to ../ (matches pyproject.toml path source)
            git clone https://x-access-token:${GH_PAT}@github.com/IggyIkenna/unified-events-interface.git ../unified-events-interface
            echo "✅ Cloned unified-events-interface"

            # Clone unified-trading-deployment-v2 (optional - for smoke tests)
            git clone https://x-access-token:${GH_PAT}@github.com/IggyIkenna/unified-trading-deployment-v2.git deps/unified-trading-deployment-v2 || echo "⚠️ Could not clone unified-trading-deployment-v2 (optional)"
          else
            echo "❌ GH_PAT not set" && exit 1
          fi

      - name: Install ripgrep (required for codex checks)
        run: sudo apt-get update && sudo apt-get install -y ripgrep


      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -e deps/unified-cloud-services
          uv pip install --system -e ../unified-events-interface
          uv pip install --system -e deps/unified-trading-deployment-v2 2>/dev/null || echo "⚠️ unified-trading-deployment-v2 not available"
          uv pip install --system -e . --no-deps
          uv pip install --system pydantic pydantic-settings pandas numpy python-dateutil \
            python-dotenv requests ccxt plotly web3 eth-abi databento boto3 \
            exchange-calendars yfinance polars
          uv pip install --system pytest pytest-asyncio pytest-mock pytest-timeout pytest-xdist ruff==0.15.0

      # ========================================================================
      # LINT + FORMAT - auto-fix then verify no diff (catches unformatted code)
      # ========================================================================
      - name: Lint and format check
        run: |
          ruff check --fix instruments_service/ tests/
          ruff format instruments_service/ tests/
          git diff --exit-code || {
            echo "❌ Code not formatted. Run locally: ruff check --fix . && ruff format ."
            git diff
            exit 1
          }
          echo "✅ Lint and format check passed"

      # ========================================================================
      # UNIT TESTS - MUST PASS
      # ========================================================================
      - name: Run unit tests
        run: |
          echo "=== Running unit tests ==="
          python -m pytest tests/unit/ -v --tb=short --timeout=60 -n auto
          echo "✅ Unit tests passed"

      # ========================================================================
      # INTEGRATION TESTS - MUST PASS
      # ========================================================================
      - name: Run integration tests
        run: |
          echo "=== Running integration tests ==="
          if [ -d "tests/integration" ]; then
            python -m pytest tests/integration/ -v --tb=short --timeout=120 -n auto \
              --ignore=tests/integration/test_performance.py \
              -k "not api and not live and not download"
            echo "✅ Integration tests passed"
          else
            echo "No integration tests directory found"
          fi

      # ========================================================================
      # E2E TESTS - MUST PASS
      # ========================================================================
      - name: Run e2e tests
        env:
          CLOUD_MOCK_MODE: "true"
          GOOGLE_CLOUD_PROJECT: "test-project"
        run: |
          echo "=== Running e2e tests ==="
          if [ -d "tests/e2e" ]; then
            python -m pytest tests/e2e/ -v --tb=short --timeout=180 -n auto
            echo "✅ E2E tests passed"
          else
            echo "No e2e tests directory found"
          fi

      # ========================================================================
      # SMOKE TESTS (shard combinatorics) - MUST PASS (if deployment configs available)
      # ========================================================================
      - name: Run smoke tests
        env:
          CLOUD_MOCK_MODE: "true"
          GOOGLE_CLOUD_PROJECT: "test-project"
          DEPLOYMENT_CONFIG_DIR: "deps/unified-trading-deployment-v2/configs"
        run: |
          echo "=== Running smoke tests ==="
          if [ -d "tests/smoke" ] && [ -d "deps/unified-trading-deployment-v2/configs" ]; then
            python -m pytest tests/smoke/ -v --tb=short --timeout=180 -n auto
            echo "✅ Smoke tests passed"
          else
            echo "⚠️ Skipping smoke tests (deployment configs not available)"
          fi

      - name: Quality gates passed
        run: |
          echo ""
          echo "======================================================================"
          echo "✅ ALL QUALITY GATES PASSED"
          echo "======================================================================"
