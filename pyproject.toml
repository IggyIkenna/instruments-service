[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "instruments-service"
version = "1.0.6"
description = "Service for generating canonical instrument definitions from exchange APIs"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Unified Trading System", email = "ikenna@odum-research.com"}
]
keywords = ["trading", "instruments", "exchange", "market-data", "ccxt", "cryptocurrency"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.13,<3.14"
dependencies = [
    # Core data processing (aligned with unified-cloud-services)
    "numpy>=2.1.0,<2.4.0",
    "pandas>=2.2.3,<3.0.0",
    "polars>=1.0.0",  # Required by unified-cloud-services feature_data_loader
    # Validation
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    # Utilities
    "python-dateutil>=2.8.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.5",
    # Exchange integrations
    "ccxt>=4.5.24",
    "web3>=6.0.0",
    "eth-abi>=4.0.0",
    "databento>=0.20.0",
    "exchange-calendars>=4.5.0",
    "yfinance>=0.2.50",
    # Visualization
    "plotly>=6.4.0",
    # AWS
    "boto3>=1.40.70",
    "unified-config-interface>=1.0.0,<2.0.0",
    "unified-events-interface>=1.0.0,<2.0.0",
    "unified-domain-services>=1.0.0,<2.0.0",
    "unified-market-interface>=1.0.0,<2.0.0",
    # NOTE: unified-cloud-services is installed separately:
    #   - Local: setup.sh installs via SSH
    #   - Cloud Build/Docker: cloned via HTTPS with PAT
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-mock>=3.14.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.6.0",
    "ruff==0.15.0",
    "basedpyright>=1.20.0,<2.0.0",
    "pip-audit>=2.7.0",
    "bandit>=1.7.0",
    "prek>=0.3.2",
    "pandas-stubs>=2.2.0,<3.0.0",
]

[project.scripts]
instruments-service = "instruments_service.cli.main:run_cli"

[project.urls]
Homepage = "https://github.com/iggyikenna/instruments-service"
Documentation = "https://github.com/iggyikenna/instruments-service"
Repository = "https://github.com/iggyikenna/instruments-service"

[tool.setuptools]
packages = ["instruments_service"]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]  # line too long handled by formatter

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
# Allow imports not at top of file where intentional (setup before imports)
"instruments_service/cli/main.py" = ["E402"]
"tests/conftest.py" = ["E402"]
"scripts/*" = ["E722"]  # Allow bare except in scripts
# Config property names override parent UnifiedCloudConfig (API compatibility)
"instruments_service/config/service_config.py" = ["N802"]
# Class constants (KNOWN_ETFS, SPACE_TO_DOT_SYMBOLS) - ClassVar would require refactor
"instruments_service/config.py" = ["RUF012"]
"instruments_service/config/venue_config.py" = ["RUF012"]
# Manual mapping constants in functions (N806)
"instruments_service/app/core/processors/ccxt_manual_fallback.py" = ["N806"]
"instruments_service/engine/processors/ccxt_manual_fallback.py" = ["N806"]
# Test constants (N806)
"tests/unit/test_cloud_agnostic_paths.py" = ["N806"]
# Smoke tests: E402 (import after importorskip), F821 (external pkg may not be in workspace)
"tests/smoke/test_shard_combinatorics.py" = ["E402", "F821"]

[tool.coverage.report]
fail_under = 35  # Minimum coverage requirement
show_missing = true
skip_covered = false
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "raise NotImplementedError",
]

[tool.basedpyright]
include = ["instruments_service"]
exclude = ["tests", "**/__pycache__", ".venv*", "build", "dist"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportMissingImports = "error"
reportUnusedVariable = "warning"
reportUnusedImport = "warning"
# Enforce no Any — must use specific types (see .cursor/rules/no-type-any-use-specific.mdc)
reportAny = "warning"
# Enforce known types — warn on unknown parameter/return/variable types
reportUnknownVariableType = "warning"
reportUnknownParameterType = "warning"
reportUnknownMemberType = "warning"
