# AWS CodeBuild specification for instruments-service
# Mirrors cloudbuild.yaml flow: build Docker image → push to ECR
#
# Prerequisites:
#   - UTL base image in ECR: 427895769566.dkr.ecr.ap-northeast-1.amazonaws.com/unified-trading-library:latest
#   - ECR repo: instruments-service
#   - CodeBuild service role with ECR push permissions
#
# Environment variables (set in CodeBuild project or override):
#   AWS_ACCOUNT_ID    — e.g. 427895769566
#   AWS_DEFAULT_REGION — e.g. ap-northeast-1
#   IMAGE_REPO_NAME   — e.g. instruments-service
#   GCP_PROJECT_ID    — GCP project for pip.conf AR index (build-time only)

version: 0.2

env:
  variables:
    AWS_ACCOUNT_ID: "427895769566"
    AWS_DEFAULT_REGION: "ap-northeast-1"
    IMAGE_REPO_NAME: "instruments-service"
    GCP_PROJECT_ID: "central-element-323112"

phases:
  pre_build:
    commands:
      - echo "=== Pre-build phase ==="
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - ECR_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - IMAGE_URI=$ECR_URI/$IMAGE_REPO_NAME
      - BASE_IMAGE_URI=$ECR_URI/unified-trading-library:latest
      # Extract version from pyproject.toml
      - VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/version = "//;s/"//')
      - echo "Building version $VERSION"
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - echo "Commit $COMMIT_HASH"

  build:
    commands:
      - echo "=== Build phase ==="
      - echo "Building Docker image with ECR base image..."
      # Build using --build-arg to override the FROM image to use ECR base
      - |
        docker build -f Dockerfile \
          --build-arg PROJECT_ID=$GCP_PROJECT_ID \
          --build-arg BASE_IMAGE=$BASE_IMAGE_URI \
          -t $IMAGE_URI:$VERSION \
          -t $IMAGE_URI:$COMMIT_HASH \
          -t $IMAGE_URI:latest \
          .
      - echo "Build completed successfully"

  post_build:
    commands:
      - echo "=== Post-build phase ==="
      - echo "Pushing Docker image to ECR..."
      - docker push $IMAGE_URI:$VERSION
      - docker push $IMAGE_URI:$COMMIT_HASH
      - docker push $IMAGE_URI:latest
      - echo "Push completed — $IMAGE_URI:$VERSION"
      - echo "Image digest:"
      - aws ecr describe-images --repository-name $IMAGE_REPO_NAME --image-ids imageTag=$VERSION --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || echo "N/A"
