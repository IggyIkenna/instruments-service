[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Note: pytest_plugins is declared in conftest.py (not valid in pytest.ini)
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    asyncio: Async tests (pytest-asyncio)
    api: Tests requiring real API/Secret Manager (excluded in CI)
    live: Live service tests (excluded in CI)
asyncio_mode = auto
